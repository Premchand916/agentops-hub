[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentops-hub"
version = "0.1.0"
description = "Multi-agent AI operations assistant"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
# Open pyproject.toml and change the include line to:
include = ["agents*", "rag*", "mcp_servers*", "evals*", "observability*", "app*", "config*", "scripts*", "tools*"]