# ─────────────────────────────────────────────
# .github/workflows/docker.yml
# ─────────────────────────────────────────────
# Trigger: push to main (after PR merged)
# Job: build Docker image, push to GitHub Container Registry (ghcr.io)
# ─────────────────────────────────────────────

name: Docker Build

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # e.g. Premchand916/agentops-hub

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write # needed to push to ghcr.io

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # auto-provided by GH Actions

      # 3. Extract metadata (tags + labels from git ref)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-          # e.g. sha-ceb1a34
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # 4. Set up Docker Buildx (enables multi-platform + layer caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Build + push
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha # GitHub Actions cache
          cache-to: type=gha,mode=max
